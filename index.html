<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ツールメニュー</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; margin: 0; padding: 24px 16px; background: #f3f4f6; color: #222; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .card h2 { font-size: 16px; margin: 0 0 4px; }
  .card h2 a { color: #2563eb; text-decoration: none; }
  .card h2 a:hover { text-decoration: underline; }
  .card p { font-size: 13px; color: #555; margin: 0 0 10px; line-height: 1.6; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .links a { padding: 6px 14px; border-radius: 6px; background: #2563eb; color: #fff; font-size: 14px; text-decoration: none; }
  .links a.sub { background: #6b7280; }
  .links a:hover { opacity: .85; }
  @media (prefers-color-scheme: dark) {
    body { background: #111827; color: #e5e7eb; }
    .card { background: #1f2937; }
    .card p { color: #9ca3af; }
    .card h2 a { color: #60a5fa; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>ツールメニュー</h1>

  <!-- ツールを増やすときは、下の .card をコピーして href を書き換えてください -->
  <div class="card">
    <h2><a href="MapGraph.htm">MapGraph：地域 値マップ</a></h2>
    <p>CSVの値を白地図に表示します（円の大きさ・塗り分け）。CSVの地域名から、全国の都道府県／島根県の市町村を自動で判定します。</p>
    <div class="links">
      <a href="MapGraph.htm">自動判定で開く</a>
      <a class="sub" href="MapGraph.htm#map=pref-geo">全国 都道府県</a>
      <a class="sub" href="MapGraph.htm#map=shimane">島根県 市町村</a>
    </div>
  </div>
</div>
</body>
</html>
